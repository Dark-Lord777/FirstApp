name: Test apk futures branch 

on: 
  workflow_dispatch:
  push: 
    branches:
    - 'feature/**'
    - 'future/**'
    - 'test/**'
    - 'dev/**'


env:
  FLUTTER_VERSION: '3.44.1'  
  KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
  KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
  KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN_bossHQ_bot }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID_My_ID }}
  PROJECT: WheelOfFortune_V 
  FUTURES: futures.txt
  RUN_URL: 'https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}'
  SHOREBIRD_TOKEN: ${{secrets.SHOREBIRD_TOKEN}}

permissions:
  contents: write
  actions: write
  id-token: write 

concurrency: 
  group: "deploy-${ github.ref }"
  cancel-in-progress: true
  
jobs:
    build-apk:
      if: github.ref != 'main'
      runs-on: ubuntu-latest
      outputs: 
        build_status: ${{ steps.build.outcome }}
        test_status: ${{ steps.test.outcome }}
      steps:
         #Now for debug i do this steps. I understand that doesn't like you but it's neneded.   
      #And fuck, I am the king of the project here. Hah
      - uses: actions/checkout@v4
      
      - name: Setup keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/keystore.jks
          cat > android/key.properties << EOF
          storeFile=keystore.jks
          storePassword=${{ env.KEYSTORE_PASSWORD }}
          keyPassword=${{ env.KEY_PASSWORD }}
          keyAlias=${{ env.KEY_ALIAS }}
          EOF
      
      - uses: subosito/flutter-action@v2
        with: 
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true 
      - uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-
      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick bc
      - name: Setup shorebird 
        run: |
          curl --proto '=https' --tlsv1.2 https://raw.githubusercontent.com/shorebirdtech/install/main/install.sh -sSf | bash
          ls -la "$HOME/.config/shorebird/bin"

      - name: Shorebird Login 
        run: |
          #~/.config/shorebird/bin/shorebird --version
          #~/.config/shorebird/bin/shorebird login --ci
          echo "$SHOREBIRD_TOKEN" | ~/.config/shorebird/bin/shorebird login
        env: 
          SHOREBIRD_TOKEN: ${{ env.SHOREBIRD_TOKEN }}


      - name: Generate Dynamic Icons 
        continue-on-error: true
        run: |
          flutter pub get
          ./resize_icons.sh 
    
      - name: Remove adaptive icons (fix AAPT errors)
        run: |
          rm -rf android/app/src/main/res/mipmap-anydpi-v26/
          echo "✅ Removed mipmap-anydpi-v26"


          
      - name: Cat version from file
        id: git_version 
        run: |
            APP_VERS=$(tail -n 1 version_of_project | tr -d '\n\r')
            echo "APP_VERS=$APP_VERS" >> $GITHUB_OUTPUT

      - name: Build APK 
        id: build
        run: |
          ~/.config/shorebird/bin/shorebird release android --artifact apk --obfuscate
          cd build/app/outputs/flutter-apk/
          VERSION="${{ steps.git_version.outputs.APP_VERS }}"
          mv app-release.apk "${PROJECT}${VERSION}.apk"


      - name: Notify Telegram if build failed
        if: steps.build.outcome == 'failure'
        run: |
          curl -s -X POST https://api.telegram.org/bot${{ env.TELEGRAM_BOT_TOKEN }}/sendMessage \
            -d chat_id=${{ env.TELEGRAM_CHAT_ID }} \
            -d text="[ERROR] *APK Build Failed!*%0A📦 ${{ github.repository }}%0A🔴 Error during Flutter build%0A🔗 [View the failed run](${{ env.RUN_URL }})" \
            -d parse_mode=Markdown    
      
      - name: Cat version from file 
        if: steps.build.outcome == 'success'
        #id: git_version 
        run: |
          APP_VERS=$(tail -n 1 version_of_project | tr -d '\n\r')
          echo "APP_VERS=$APP_VERS" >> $GITHUB_OUTPUT
      
      - name: Rename and zip
        if: steps.build.outcome == 'success'
        run: |
          cd build/app/outputs/flutter-apk/
          VERSION="${{ steps.git_version.outputs.APP_VERS }}"
          # mv app*.apk "${PROJECT}${VERSION}.apk"
          zip "${PROJECT}${VERSION}.zip" "${PROJECT}${VERSION}.apk"
      
      
      
      - name: Read Features from file
        if: steps.build.outcome == 'success'
        id: features
        run: |
         if [ -f "${{ env.FUTURES }}" ]; then
          CONTENT=$(cat "${{ env.FUTURES }}")
         else
          CONTENT="No features listed"
         fi
         echo "content<<EOF" >> $GITHUB_OUTPUT
         echo "$CONTENT" >> $GITHUB_OUTPUT
         echo "EOF" >> $GITHUB_OUTPUT 

          
      - name: Upload APK to Hugging face space
        if: steps.build.outcome == 'success'
        run: |
          VERSION="${{steps.git_version.outputs.APP_VERS}}"
          APK_PATH="build/app/outputs/flutter-apk/${{ env.PROJECT }}${VERSION}.apk"

          curl -X POST \
          -F "file=@${APK_PATH}" \
          https://Dark-Lord777-homelab.hf.space/upload

      - name: Send APK to Telegram channel
        if: steps.build.outcome == 'success'
        run: |
          VERSION="${{ steps.git_version.outputs.APP_VERS }}"
          APK_PATH="build/app/outputs/flutter-apk/${{ env.PROJECT }}${VERSION}.apk"
          
          FEATURES=$(cat "${{ env.FUTURES }}" | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g')
          
          curl -s -X POST "https://api.telegram.org/bot${{ env.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ env.TELEGRAM_CHAT_ID }}" \
            -d text="<b>New Build!</b>\nProject: ${{ env.PROJECT }}${VERSION}\n\n${FEATURES}" \
            -d parse_mode="HTML"
          
          curl -s -X POST "https://api.telegram.org/bot${{ env.TELEGRAM_BOT_TOKEN }}/sendDocument" \
            -F chat_id="${{ env.TELEGRAM_CHAT_ID }}" \
            -F document="@${APK_PATH}" \
            -F caption="${{ env.PROJECT }} ${VERSION}"

patch:
  if: |
    github.ref != 'main' && 
    contains(github.event.head_commit.message, 'patch')
  runs-on: ubuntu-latest
  needs: [build-apk]
  steps: 
    - uses: actions/checkout@v4

    - uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ env.FLUTTER_VERSION }}
        cache: true 

    - name: Setup Shorebird 
      run: |
        curl --proto '=https' --tlsv1.2 https://raw.githubusercontent.com/shorebirdtech/install/main/install.sh -sSf | bash
        echo "$HOME/.config/shorebird/bin" >> $GITHUB_PATH

    - name: Shorebird login
      run: |
        echo "$SHOREBIRD_TOKEN" | ~/.config/shorebird/bin/shorebird login
      env: 
        SHOREBIRD_TOKEN: ${{ env.SHOREBIRD_TOKEN }}

    - name: Create Patch
      run: |
        ~/.config/shorebird/bin/shorebird patch android --obfuscate

    

    - name: Notify about Patch
      run: |
        curl -s -X POST "https://api.telegram.org/bot${{ env.TELEGRAM_BOT_TOKEN }}/sendMessage" \
          -d chat_id="${{ env.TELEGRAM_CHAT_ID }}" \
          -d text="<b>🔄 Patch Created!</b>\nProject: ${{ env.PROJECT }}\nPatch applied successfully!\nUsers will get update on next launch." \
          -d parse_mode="HTML"


